<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinTrack - Login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="center">
  <div class="card auth-card">
    <h1>💰 FinTrack</h1>
    <p class="muted">Personal Finance Intelligence Platform</p>
    <div class="tabs">
      <button id="tabLogin" class="tab active">Login</button>
      <button id="tabRegister" class="tab">Register</button>
    </div>
    <input id="name" placeholder="Name" style="display:none" />
    <input id="email" type="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Password" />
    <button id="submitBtn" class="btn">Login</button>
    <p id="msg" class="error"></p>
  </div>
  <script src="js/login.js"></script>
</body>
</html>
